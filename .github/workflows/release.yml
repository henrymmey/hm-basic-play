name: Build & Release Modpack

on:
  release:
    types: [published]

permissions:
  contents: write # nötig, um Dateien an den Release anzuhängen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Verify platform content parity
        run: bash .github/scripts/check-platform-parity.sh

      - name: Build Modrinth Package (.mrpack)
        working-directory: platforms/modrinth
        run: packwiz modrinth export -o ../../hm-basic-play-${{ github.event.release.tag_name }}.mrpack

      - name: Build CurseForge Package (.zip)
        working-directory: platforms/curseforge
        run: packwiz curseforge export -o ../../hm-basic-play-${{ github.event.release.tag_name }}.zip

      - name: Upload to Modrinth & CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          # === Modrinth ===
          modrinth-id: kUYTdD3h
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: hm-basic-play-${{ github.event.release.tag_name }}.mrpack

          # === CurseForge ===
          curseforge-id: 1352468
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: hm-basic-play-${{ github.event.release.tag_name }}.zip

          # === Gemeinsame Einstellungen ===
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          loaders: fabric
          game-versions: "26.3"

      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hm-basic-play-${{ github.event.release.tag_name }}.mrpack
            hm-basic-play-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
